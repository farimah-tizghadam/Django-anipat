name: Django Project

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      SECRET_KEY: github-actions-test-secret-key-longer-than-32-characters
      DEBUG: "False"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Docker versions
        run: |
          docker --version
          docker compose version

      - name: Build images (stage)
        run: docker compose -f docker-compose-stage.yml build

      - name: Start Postgres & Redis
        run: docker compose -f docker-compose-stage.yml up -d postgres redis

      - name: Wait for Postgres
        run: |
          docker compose -f docker-compose-stage.yml exec -T postgres \
            sh -c 'until pg_isready -U admin -d anipat-db; do sleep 1; done'

      - name: Run migrations
        run: docker compose -f docker-compose-stage.yml run --rm migrate

      - name: Start backend
        run: docker compose -f docker-compose-stage.yml up -d backend

      - name: Show running containers
        run: docker compose ps

      - name: Run Django checks
        run: docker compose exec -T backend python manage.py check

      - name: Check migrations
        run: docker compose exec -T backend python manage.py makemigrations --check --dry-run

      - name: Run black
        run: docker compose exec -T backend black .

      - name: Run flake8
        run: docker compose exec -T backend flake8 .

      - name: Run pytest
        run: docker compose exec -T backend pytest -v

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color
