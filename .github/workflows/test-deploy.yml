name: Django Project

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      SECRET_KEY: github-actions-test-secret-key-longer-than-32-characters
      DEBUG: "False"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Docker versions
        run: |
          docker --version
          docker compose version

      - name: Build images
        run: docker compose -f docker-compose-stage.yml build

      - name: Start PostgreSQL and Redis
        run: |
          docker compose -f docker-compose-stage.yml up -d postgres redis

      - name: Wait for PostgreSQL
        run: |
          docker compose -f docker-compose-stage.yml exec -T postgres \
            sh -c 'until pg_isready -U admin -d anipat-db; do sleep 1; done'

      - name: Run migrations
        run: |
          docker compose -f docker-compose-stage.yml run --rm migrate

      - name: Start backend
        run: |
          docker compose -f docker-compose-stage.yml up -d backend

      - name: Show running containers
        run: |
          docker compose -f docker-compose-stage.yml ps

      - name: Test PostgreSQL hostname
        run: |
          docker compose -f docker-compose-stage.yml exec -T backend \
            python -c "import socket; print(socket.gethostbyname('postgres'))"

      - name: Run Django checks
        run: |
          docker compose -f docker-compose-stage.yml exec -T backend \
            python manage.py check

      - name: Check migrations
        run: |
          docker compose -f docker-compose-stage.yml exec -T backend \
            python manage.py makemigrations --check --dry-run

      - name: Check Black formatting
        run: |
          docker compose -f docker-compose-stage.yml exec -T backend \
            black --check .

      - name: Run flake8
        run: |
          docker compose -f docker-compose-stage.yml exec -T backend \
            flake8 .

      - name: Run pytest
        run: |
          docker compose -f docker-compose-stage.yml exec -T backend \
            pytest -v

      - name: Show container logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose-stage.yml logs --no-color


  deploy:
    name: Deploy
    needs: test

    # Deploy only after successful tests,
    # only for a push to main, not a pull request.
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.test.result == 'success'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Connect and execute commands
        uses: appleboy/ssh-action@v1.2.2
        with:
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          host: ${{ secrets.HOST }}
          port: ${{ secrets.PORT }}

          script: |
            ls