
name: Django Project

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      SECRET_KEY: github-actions-test-secret-key-longer-than-32-characters
      DEBUG: "False"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Docker versions
        run: |
          docker --version
          docker compose version
      - name: Build and start containers
        run: docker compose up -d --build

      - name: Show running containers
        run: docker compose ps

      - name: Run Django checks
        run: docker compose exec -T backend python manage.py check

      - name: Check migrations
        run: docker compose exec -T backend python manage.py makemigrations --check --dry-run

      - name: Run flake8
        run: docker compose exec -T backend flake8 .

      - name: Run pytest
        run: docker compose exec -T backend pytest -v

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color