{% extends 'base.html'%}

{% block content %}
{% load static %}
<!-- start banner Area -->
<section class="relative about-banner">
	<div class="overlay overlay-bg"></div>
	<div class="container">
		<div class="row d-flex align-items-center justify-content-center">
			<div class="about-content col-lg-12">
				<h1 class="text-white">
					Profile
				</h1>
				<p class="text-white link-nav"><a href="{% url 'website:index' %}">Home </a> <span
						class="lnr lnr-arrow-right"></span>
					<a href="{% url 'accounts:profile' %}">Profile</a>
				</p>
			</div>
		</div>
	</div>
</section>
<!-- End banner Area -->

<section class="contact-page-area section-gap">
	<div class="container">
		<div class="">
			<div class="col-lg-8">
				<form class="form-area" action="{% url 'accounts:profile' %}" method="post">
					<div class="">
						{% csrf_token %}
						<div class="col-lg-6 form-group">
							<label for="{{ profile_form.first_name.id_for_label }}">first_name:</label>
							<input name="first_name" placeholder="Enter your name" onfocus="this.placeholder = ''"
								class="common-input mb-20 form-control" value="{{profile_form.first_name.value|default_if_none:''}}"
								onblur="this.placeholder = 'Enter your name'" type="text" >

							<label>last_name:</label>
							<input name="last_name" placeholder="Enter last name" class="common-input mb-20 form-control"
								onfocus="this.placeholder = ''" onblur="this.placeholder = 'Enter email address'"
								type="text" value="{{profile_form.instance.last_name}}">

							<label>email:</label>
							<input name="email" placeholder="Enter email" onfocus="this.placeholder = ''"
								class="common-input mb-20 form-control" value="{{request.user.email}}"
								pattern="[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{1,63}$"
								onblur="this.placeholder = 'Enter email'" type="email">

								
							<label>password:</label>
							<input name="password" placeholder="Enter password" onfocus="this.placeholder = ''"
								class="common-input mb-20 form-control"  type="password"
								onblur="this.placeholder = 'Enter password'" class="common-input mb-20 form-control">
						</div>
						<div class="col-lg-12">
							<div class="alert-msg"></div>
							<button type="submit" class="btn btn-primary">
    							Save Changes
							</button>
						</div>
					</div>
				</form>
			</div>
		</div>
	</div>
</section>
{% endblock %}
