{% load static %}

<aside class="single_sidebar_widget tag_cloud_widget">
    <h4 class="widget_title">Tag Clouds</h4>
    <ul class="list">
        {% for tag in tags %}
        <li>
            <a href="{% url 'blog:posts-by-tag' tag_name=tag.slug %}">{{ tag.name }}</a>
        </li>
        {% empty %}
        <span>No tags</span>
        {% endfor %}
    </ul>
</aside>
