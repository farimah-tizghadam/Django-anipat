{% extends "base.html" %}

{% block title %}
Check Your Email
{% endblock %}

{% block content %}

<section class="contact-page-area section-gap">
    <div class="container">

        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8">

                <div class="password-card text-center">

                    <div class="mail-icon">
                        <i class="fa fa-envelope-o"></i>
                    </div>

                    <h2>Check Your Email</h2>

                    <p class="text-muted mt-3">
                        If an account exists with the email address you entered,
                        we've sent instructions for resetting your password.
                    </p>

                    <p class="text-muted">
                        Please check your inbox and spam folder.
                    </p>

                    <a
                        href="{% url 'accounts:login' %}"
                        class="reset-link-btn"
                    >
                        Back to Login
                    </a>

                </div>

            </div>
        </div>

    </div>
</section>

<style>
.password-card {
    background: #ffffff;
    padding: 45px;
    border-radius: 12px;
    box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
}

.password-card h2 {
    font-weight: 700;
}

.mail-icon {
    font-size: 55px;
    color: #ff3500;
    margin-bottom: 20px;
}

.reset-link-btn {
    display: inline-block;
    background: #ff3500;
    color: #fff;
    padding: 13px 28px;
    border-radius: 5px;
    margin-top: 15px;
}

.reset-link-btn:hover {
    background: #e52f00;
    color: #fff;
    text-decoration: none;
}
</style>

{% endblock %}
