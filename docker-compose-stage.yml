
services:

  redis:
    container_name: redis
    image: redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning

  
  postgres:
    image: postgres:17.1
    container_name: postgres-anipat
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: always
    environment:
      - POSTGRES_DB=anipat-db           
      - POSTGRES_USER=admin             
      - POSTGRES_PASSWORD=a/@123456
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "anipat-db", "-U", "admin"]
      interval: 5s
      timeout: 5s
      retries: 10  


  migrate:
    build: .
    working_dir: /app/core
    volumes:
      - ./:/app
    command: python manage.py migrate --noinput
    environment:
      - SECRET_KEY=test
      - DEBUG=False
      - DB_HOST=postgres
      - DB_NAME=anipat-db
      - DB_USER=admin
      - DB_PASSWORD=a/@123456
    depends_on:
     - postgres 


  backend:
    build: .
    command: sh -c "python manage.py collectstatic --noinput && gunicorn core.wsgi --bind 0.0.0.0:8000"
    volumes:
      - ./core:/app
      - static_volume:/app/static
      - media_volume:/app/media
    expose:
      - 8000
    environment:
      - SECRET_KEY=Test
      - DEBUG=True
      - DB_HOST=postgres
      - DB_NAME=anipat-db         
      - DB_USER=admin              
      - DB_PASSWORD=a/@123456  
    depends_on:
      - redis
      - postgres


  beater:
    build: .
    working_dir: /app/core  
    volumes:
      - ./:/app
    command: celery -A core beat -l INFO --scheduler django_celery_beat.schedulers:DatabaseScheduler
    depends_on:
      - redis
      - backend
      - postgres
    environment:
      - SECRET_KEY=Test
      - DEBUG=False
      - DB_NAME=anipat-db
      - DB_USER=admin
      - DB_PASSWORD=a/@123456
      - DB_HOST=postgres

  celery_worker:
    build: .
    volumes:
      - ./core:/app
    command: celery -A core worker -l INFO
    environment:
      - SECRET_KEY=Test
      - DEBUG=True
    depends_on:
      - redis
      - backend
      - postgres

  master:
    image: locustio/locust
    ports:
     - "10001:8089"
    volumes:
      - ./core/locust:/mnt/locust
    command: -f /mnt/locust/locustfile.py --master -H http://backend:8000
  
  worker:
    image: locustio/locust
    volumes:
      - ./core/locust:/mnt/locust
    command: -f /mnt/locust/locustfile.py --worker --master-host master

  
  nginx:
    image: nginx
    container_name: nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/home/app/static
      - media_volume:/home/app/media
    depends_on:
      - redis
      - backend


volumes:
  static_volume:
  media_volume:
  db_data: