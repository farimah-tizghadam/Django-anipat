version: '3.9'

services:
  backend:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./core:/app
    ports:
      - 8888:8000
    environment:
      - SECRET_KEY=Test
      - DEBUG=True


      
  smtp4dev:
    image: rnwood/smtp4dev:latest
    ports:
      - "5000:80"
      - "2525:25"